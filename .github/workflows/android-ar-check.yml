name: Android native AR build check

# Native Android APK checks are manual-only; routine website updates must not build APKs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: npx expo prebuild --platform android --no-install
      - name: Compile Android debug app with ARCore integration
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: danat-build-android-ar-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Prepare PDF export dependencies
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-pdf-dependencies.yml"
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add Expo SDK 54 PDF and sharing modules
        run: npm install --save-exact expo-print@15.0.8 expo-sharing@14.0.8
      - name: Commit generated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Expo PDF export dependencies"
            git push
          fi

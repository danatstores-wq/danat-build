name: Build Danat Build standalone Android APK
# Use assembleRelease so the installed app starts directly and never opens the dev-server launcher.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-preview-apk.yml"
      - "eas.json"
      - "app.config.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "App.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Bundle JavaScript into the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          match = re.search(r"(?m)^react\\s*\\{", s)
          if not match:
              raise SystemExit("Could not find the React Native Gradle react { } configuration.")
          start = match.end()
          # Replace an existing debuggableVariants setting, or add one at the start
          # of the react block. An empty list makes Gradle embed the JS bundle in debug.
          block_end = s.find("\\n}", start)
          if block_end < 0:
              raise SystemExit("Could not find the end of the React Native Gradle configuration.")
          block = s[start:block_end]
          if re.search(r"(?m)^\\s*debuggableVariants\\s*=", block):
              block = re.sub(r"(?m)^\\s*debuggableVariants\\s*=.*$", "    debuggableVariants = []", block)
          else:
              block = "\\n    debuggableVariants = []" + block
          s = s[:start] + block + s[block_end:]
          p.write_text(s)
          print("Configured the Android debug variant to embed the JavaScript bundle.")
          PY

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v4
        with:
          name: danat-build-standalone-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

name: Publish Firebase construction benchmarks to Danat Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install Firebase Admin dependencies
        run: npm ci
        working-directory: functions
      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DANAT_BUILD }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_DANAT_BUILD repository secret"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Read Firebase master and generate static app data
        run: node scripts/publishBenchmarks.cjs
        working-directory: functions
      - name: Commit updated benchmark bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publishedMarketBenchmarks.ts
          if git diff --cached --quiet; then
            echo "No benchmark changes to publish."
          else
            git commit -m "Publish monthly Firebase construction benchmarks"
            git push origin HEAD:main
          fi
